server {
    listen 80;
    listen [::]:80;
    server_name tokfires.com;
    include snippets/lets-encrypt-alias.conf;
    location / { return 301 https://tokfires.com$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name tokfires.com;
    ssl_certificate /etc/letsencrypt/live/tokfires.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tokfires.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TokFireSSL:1m;
    ssl_session_timeout 1d;
    root /opt/tokfire/current/public;
    client_max_body_size 5m;
    access_log /home/tokfireweb/tokfire-bench/logs/access.log;
    error_log /home/tokfireweb/tokfire-bench/logs/error.log;
    include snippets/lets-encrypt-alias.conf;
    location ~ /\.(?!well-known).* { deny all; }
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-TokFire-Client-IP $remote_addr;
        proxy_read_timeout 60s;
    }
}
