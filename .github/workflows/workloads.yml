name: Workload framework
on:
  workflow_dispatch:
  push:
    paths: ['native/Sources/LocalAIBench/Resources/workload*', 'native/Sources/LocalAIBench/Resources/agent_workloads.py', 'native/Sources/LocalAIBench/Resources/advanced*', 'native/Tests/test_advanced_workloads.py', 'native/Tests/test_workloads.py', 'native/Tests/test_agent_workloads.py', 'lib/workloads.ts', 'tests/workloads.test.mjs', 'android/**', '.github/workflows/workloads.yml']
permissions:
  contents: read
jobs:
  runner:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Workload protocol and failure tests
        run: python -m unittest discover -s native/Tests -p "test_*workloads.py" -v
      - name: Probe platform hardware without identifiers
        run: python -c "import sys,json; sys.path.insert(0,'native/Sources/LocalAIBench/Resources'); from workload_runner import detect_hardware; print(json.dumps(detect_hardware()))"
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: bash android/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: TokFireBench-Android-Preview
          path: android/build/TokFireBench-0.7.0-android-preview.apk*
